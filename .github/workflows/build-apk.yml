name: Build Dragon Run Z Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract game project
        run: |
          mkdir project
          unzip -q dragon-run-z-source.zip -d project
      - name: Install dependencies and Capacitor
        working-directory: project
        run: |
          npm ci
          npm install @capacitor/core@^7 @capacitor/android@^7
          npm install --save-dev @capacitor/cli@^7
      - name: Build web game
        working-directory: project
        run: npm run build
      - name: Create Android project
        working-directory: project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: project/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Run-Z-debug-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
